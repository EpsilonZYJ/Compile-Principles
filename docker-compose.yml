services:
  rv64:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: sysy-rv64-lab:latest
    container_name: rv64-lab
    volumes:
      - .:/app
      # 缓存构建产物（可选）
      - rv64-build-cache:/app/build
    working_dir: /app
    stdin_open: true
    tty: true
    # qemu 调试时需要的端口
    ports:
      - "1234:1234"
    command: /bin/bash

volumes:
  rv64-build-cache: